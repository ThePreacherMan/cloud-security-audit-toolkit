name: Cloud Security Audit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ruff code checks
        run: ruff check .

      - name: Run automated tests
        run: pytest --cov=cloud_audit --cov=checks --cov-report=term-missing

      - name: Test vulnerable sample audit
        run: |
          python main.py sample_data/vulnerable_environment.json \
            --output reports/vulnerable

      - name: Test secure sample audit
        run: |
          python main.py sample_data/secure_environment.json \
            --output reports/secure

      - name: Upload generated reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: cloud-security-audit-reports
          path: reports/
          retention-days: 7
