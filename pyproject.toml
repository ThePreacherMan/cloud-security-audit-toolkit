[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-security-audit-toolkit"
version = "1.0.0"
description = "A Python toolkit for detecting cloud security misconfigurations, calculating risk scores, and generating remediation reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Chigoziem Ibeh" }
]
keywords = [
    "cloud-security",
    "cybersecurity",
    "security-audit",
    "cspm",
    "aws-security",
    "risk-assessment",
    "devsecops"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5"
]

[project.scripts]
cloud-audit = "main:main"

[tool.setuptools]
packages = [
    "cloud_audit",
    "checks"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B"
]
